<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Home page of Whitewater Rafting Company, dedicated to help you get the thrill of navigating the greatest adventure ever!">
    <meta name="author" content="Eder Jesús Jiménez Reyes">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Home Page - Rapids Adventures</title>
</head>

<body>
    <header>
        <img src="images/wwr-logo.svg" alt="Whitewater Rafting Company Logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Rapids Adventures Home Page</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/large-hero.jpg" alt="Happy people in a happy whitewater rafting boat paddling happily">
            <h1>Rapids Adventures</h1>
        </div>
        <h2>Included in our services</h2>
        <section class="interesting"> <!-- Grid layout with newsletter and images that call to action-->
            <div class="newsletter">
                <h3>Interested? Sign up to our weekly newsletter!</h3>
                <form>
                    <div>
                        <label for="uname">Name</label>
                        <input type="text" id="uname" name="uname" placeholder="Enter your full name here">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address here">
                        <button>Sign me up for splashing news!</button>
                    </div>
                </form>
            </div>
            <div class="action"> <!-- Call to action with pictures and grid layout -->
                <figure>
                    <img src="images/certified-equipment.jpg" alt="Equipment Certificated picture.">
                    <figcaption>Equipment recently certified for your safety!</figcaption>
                </figure>
                <figure>
                    <img src="images/paddling-club.jpg" alt="Paddling club photo.">
                    <figcaption>Check our paddling club after your first trip!</figcaption>
                </figure>
                <p>Learn more about our Trips <a href="trips.html">here</a></p>
            </div>
        </section>
    </main>
    <footer>
        <p> &copy; 2025. Rapids Adventures. Eder Jiménez R.</p>
        <nav class="socialmedia">
            <a href="https://linkedin.com">
                <img src="images/linkedin-logo.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://facebook.com">
                <img src="images/facebook-logo.svg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-logo.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
