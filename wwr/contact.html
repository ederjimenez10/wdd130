<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Contact us website for Whitewater Rafting, to help you get the thrill of navigating the greatest adventure ever!">
    <meta name="author" content="Eder Jesús Jiménez Reyes">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us - Rapids Adventures</title>
</head>

<body>
    <header>
        <img src="images/wwr-logo.svg" alt="Whitewater Rafting Company Logo" role="img">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Rapids Adventures Home Page</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="company">
            <h1>Rapids Adventures</h1>
            <p>388 N Pleasant St<br>
                Independence, Missouri<br>
                +1 (583) 555 5555<br>
                info@rapadv.com
            </p>
        </div>
        <div class="map">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d6985.787605726506!2d-94.42663121427486!3d39.09732468414262!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sThings%20to%20do!5e0!3m2!1sen!2sus!4v1760737598388!5m2!1sen!2sus"
                width="600" height="450" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <div class="form">
            <form>
                <label for="uname">Name</label>
                <input type="text" id="uname" name="uname" placeholder="Enter your full name here">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address here">
                <label for="">Message Purpose</label>
                <label for="purpose1">General Inquiry</label>
                <input type="radio" name="purpose 1" id="purpose1">
                <label for="purpose2">Reservation Question</label>
                <input type="radio" name="purpose2" id="purpose2">
                <label for="purpose3">Website Suggestion</label>
                <input type="radio" name="purpose3" id="purpose3">
                <label for="msg">Message</label>
                <textarea name="msg" id="msg" placeholder="Type your message here"></textarea>
                <input type="checkbox" name="subs" id="subs" checked>
                <label for="subs">Please subscribe me to the monthly newsletter</label>
                <input type="submit" value="Send us your message!">
            </form>
        </div>
        <div class="employees">
            <h2>Our team ready to paddle the best service!</h2>
            <figure>
                <img src="images/employee-1.jpg" alt="Employee 1 profile picture">
                <figcaption>Nelson Melo - Founder & CEO</figcaption>
            </figure>
            <figure>
                <img src="images/employee-2.jpg" alt="Employee 2 profile picture">
                <figcaption>Danielle Olmstead - Chief Manager Coordinator</figcaption>
            </figure>
            <figure>
                <img src="images/employee-3.jpg" alt="Employee 3 profile picture">
                <figcaption>Moses Sánchez - Paddling Instructor</figcaption>
            </figure>
            <figure>
                <img src="images/employee-4.jpg" alt="Employee 4 profile picture">
                <figcaption>Twyla Knight - Equipment Tester</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p> &copy; 2025. Rapids Adventures. Eder Jiménez R.</p>
        <nav class="socialmedia">
            <a href="https://linkedin.com">
                <img src="images/linkedin-logo.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://facebook.com">
                <img src="images/facebook-logo.svg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-logo.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
