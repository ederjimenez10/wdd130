<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>

    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname"></input>
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail"></input>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <label for="browser">What is your favorite browser?</label>
                <select id="browser" name="browser">
                    <option value="brave">Brave</option>
                    <option value="opera">Opera</option>
                    <option value="firefox">Firefox</option>
                    <option value="chrome">Google Chrome</option>
                    <option value="edge">Microsoft Edge</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                    <option value="safari">Safari</option>
                </select><br><br>
                <input type="checkbox" name="pet" id="pet">
                <label for="pet">Do you have a household pet?</label><br><br>
                <label for="feedback">List the places you have lived:</label><br>
                <textarea id="feedback" name="feedback" rows="10"
                    placeholder="Caracas - Venezuela, North Las Vegas - Nevada, Puebla - Mexico, Mexico City - Mexico"></textarea>
            </fieldset>
            <button>Submit Poll</button>
        </form>
    </main>
    <footer>
    </footer>
</body>

</html>
