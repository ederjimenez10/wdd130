<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>HTML and CSS Quiz</title>
</head>

<body>
    <header>
        <h1>☑️ HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>
            <label for="q1">1. What is the full name of the root tag that contains all other elements in a standard HTML
                document structure?</label>
            <input type="text" id="q1" name="q1">
            <label for="q2">2. Explain the primary purpose of CSS (Cascading Style Sheets) in web development.</label>
            <textarea name="q2" id="q2"></textarea>
            <label for="q3">3. When using CSS Flexbox, which property is applied to the parent
                container
                to align items along the main axis?</label>
            <select name="q3" id="q3">
                <option value="a" selected disabled>Choose One:</option>
                <option value="b"><code>align-items</code></option>
                <option value="c"><code>justify-content</code></option>
                <option value="d"><code>flex-direction</code></option>
                <option value="e"><code>align-self</code></option>
            </select>
            <label for="q4">4. Consider the following basic HTML code snippet for an option element. How many distinct
                attributes are set within this
                single &lt;option&gt; tag?</label>
            <code>&lt;option value="a" selected disabled&gt;</code>
            <input type="number" name="q4" id="q4">
            <button>Submit Quiz</button>
        </form>
    </main>
    <footer>

    </footer>
</body>

</html>
